<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dominio Visual — Sistema de Gestión</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0e14;--bg2:#13161f;--bg3:#1a1e2e;--bg4:#222740;--border:#252a3d;--border2:#2f3550;--text:#dde1f0;--text2:#7a83a6;--text3:#454e6e;--blue:#9B2020;--blue-bg:#1f0808;--blue-dim:#3a1010;--green:#29d98a;--green-bg:#0a2318;--orange:#f5a623;--orange-bg:#2b1c07;--red:#f0545a;--red-bg:#280c0d;--r:8px;--r2:5px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh}
.topbar{display:flex;align-items:center;height:48px;padding:0 20px;background:var(--bg2);border-bottom:1px solid var(--border);gap:4px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:200}
.topbar::-webkit-scrollbar{display:none}
.logo{font-size:11px;font-weight:600;color:var(--text);letter-spacing:.08em;text-transform:uppercase;margin-right:16px;white-space:nowrap;flex-shrink:0;display:flex;align-items:center}
.nav-btn{padding:6px 13px;font-size:12px;color:var(--text2);background:none;border:none;border-radius:var(--r2);cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .12s;border-bottom:2px solid transparent}
.nav-btn:hover{color:var(--text);background:var(--bg3)}
.nav-btn.active{color:var(--text);background:var(--bg3);border-bottom-color:var(--blue);font-weight:500}
.cfg-strip{background:var(--blue-bg);border-bottom:1px solid var(--blue-dim);padding:8px 20px;display:flex;align-items:center;gap:10px;font-size:12px;color:#7fa8ff}
.cfg-strip input{flex:1;max-width:500px;background:rgba(255,255,255,.05);border:1px solid var(--border2);border-radius:var(--r2);color:var(--text);padding:5px 10px;font-size:11.5px;font-family:'IBM Plex Mono',monospace}
.cfg-strip input::placeholder{color:var(--text3)}
.page{display:none;padding:20px;max-width:1080px;margin:0 auto}
.page.on{display:block}
.stats{display:grid;gap:8px;margin-bottom:16px}
.s4{grid-template-columns:repeat(4,1fr)}.s3{grid-template-columns:repeat(3,1fr)}.s2{grid-template-columns:repeat(2,1fr)}
@media(max-width:680px){.s4,.s3{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.stat-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:6px}
.stat-val{font-size:22px;font-weight:600;line-height:1;font-family:'IBM Plex Mono',monospace}
.stat-sub{font-size:10.5px;color:var(--text3);margin-top:4px}
.fbar{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.fg input,.fg select{font-size:12.5px;padding:5px 9px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);color:var(--text);font-family:inherit}
.fg select option{background:var(--bg2)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:var(--r2);border:none;font-size:12px;font-family:inherit;cursor:pointer;font-weight:500;white-space:nowrap;transition:opacity .12s}
.btn:hover{opacity:.85}
.btn-prim{background:var(--blue);color:#fff}
.btn-sec{background:var(--bg3);border:1px solid var(--border2);color:var(--text)}
.btn-sm{padding:4px 10px;font-size:11.5px}
.sop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:8px}
.sop-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;transition:border-color .12s;cursor:default}
.sop-card:hover{border-color:var(--border2)}
.sop-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.sop-id{font-size:13px;font-weight:600}.sop-loc{font-size:10px;color:var(--text2);margin-top:2px}
.sop-pct{font-size:24px;font-weight:600;font-family:'IBM Plex Mono',monospace;margin:8px 0 2px}
.bar{height:3px;background:var(--bg4);border-radius:99px;margin:6px 0;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .3s}
.sop-foot{display:flex;justify-content:space-between;font-size:10px;color:var(--text3)}
.bdg{display:inline-block;font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.bdg-ok{background:var(--green-bg);color:var(--green)}.bdg-w{background:var(--orange-bg);color:var(--orange)}
.bdg-err{background:var(--red-bg);color:var(--red)}.bdg-neu{background:var(--bg3);color:var(--text2)}.bdg-blu{background:var(--blue-bg);color:var(--blue)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:5px;margin-top:4px}
.chip{padding:6px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);cursor:pointer;text-align:left;font-family:inherit;color:var(--text2);font-size:11.5px;transition:all .1s}
.chip:hover{border-color:var(--blue);color:var(--text)}
.chip.on{background:var(--blue-dim);border-color:var(--blue);color:var(--blue);font-weight:600}
.chip-id{display:block;font-weight:700;font-size:12.5px}.chip-loc{font-size:9.5px;opacity:.7}
.avail{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:10px 12px;display:none;margin-top:6px}
.avail-title{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:6px}
.avail-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border);font-size:11.5px}
.avail-row:last-child{border-bottom:none}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:580px){.fg2{grid-template-columns:1fr}}
.full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
.field input,.field select,.field textarea{padding:8px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);color:var(--text);font-size:12.5px;font-family:inherit;width:100%;transition:border-color .12s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue)}
.field input[readonly]{color:var(--text2)}
.field textarea{min-height:56px;resize:vertical}
.field .hint{font-size:10px;color:var(--text3);line-height:1.4}
.field select option{background:var(--bg2)}
.form-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.form-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:14px}
.fa{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.msg-ok{background:var(--green-bg);color:var(--green);border:1px solid rgba(41,217,138,.2);border-radius:var(--r2);padding:9px 13px;font-size:12px;display:none;margin-bottom:12px}
.msg-err{background:var(--red-bg);color:var(--red);border:1px solid rgba(240,84,90,.2);border-radius:var(--r2);padding:9px 13px;font-size:12px;display:none;margin-bottom:12px}
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding:9px 12px;background:var(--bg2);border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,.015)}
.stabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.stab{padding:5px 13px;border-radius:99px;font-size:11.5px;border:1px solid var(--border2);color:var(--text2);background:none;cursor:pointer;font-family:inherit;transition:all .1s}
.stab.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.stab:hover:not(.on){border-color:var(--blue);color:var(--blue)}
.cob-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:8px}
.cob-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.cob-prog{height:3px;background:var(--bg4);border-radius:99px;overflow:hidden;margin:8px 0 10px}
.cob-prog-fill{height:100%;background:var(--blue);border-radius:99px}
.cob-row{display:flex;justify-content:space-between;align-items:center;padding:5px 6px;border-radius:var(--r2);font-size:11.5px;margin-bottom:2px}
.cob-row:hover{background:var(--bg3)}
.chk{width:15px;height:15px;border-radius:3px;border:1px solid var(--border2);display:inline-flex;align-items:center;justify-content:center;font-size:8px;flex-shrink:0}
.chk-ok{background:var(--green);border-color:var(--green);color:#000}.chk-fut{border-color:var(--blue);color:var(--blue)}
.iva-row{display:grid;grid-template-columns:58px 1fr 80px 80px 80px;gap:8px;align-items:center;font-size:11.5px;padding:5px 0;border-bottom:1px solid var(--border)}
.iva-row:last-child{border-bottom:none}
.sec-hdr{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:10px;margin-top:6px}
.divider{height:1px;background:var(--border);margin:18px 0}
.empty{text-align:center;color:var(--text3);padding:32px;font-size:12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading-row{text-align:center;color:var(--text3);padding:28px;font-size:12px}

/* ── P&L TABLE STYLES ───────────────────────────────────── */
.pyl-table{width:100%;border-collapse:collapse;font-size:12px}
.pyl-table th{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding:10px 14px;background:var(--bg2);border-bottom:2px solid var(--border2);text-align:right;white-space:nowrap}
.pyl-table th:first-child{text-align:left}
.pyl-table td{padding:7px 14px;border-bottom:1px solid var(--border);vertical-align:middle;font-family:'IBM Plex Mono',monospace;text-align:right;color:var(--text2)}
.pyl-table td:first-child{font-family:'IBM Plex Sans',sans-serif;text-align:left;color:var(--text);padding-left:14px}
.pyl-table td.indent{padding-left:28px;color:var(--text2);font-size:11.5px}
.pyl-table tr.section-header td{background:var(--bg3);font-weight:600;font-family:'IBM Plex Sans',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);padding:8px 14px;border-top:1px solid var(--border2)}
.pyl-table tr.section-header td:first-child{text-align:left}
.pyl-table tr.subtotal td{border-top:1px solid var(--border2);border-bottom:1px solid var(--border2);font-weight:600;color:var(--text)}
.pyl-table tr.subtotal td:first-child{font-family:'IBM Plex Mono',monospace;text-align:left;padding-left:14px}
.pyl-table tr.total-row td{background:var(--bg3);border-top:2px solid var(--border2);font-weight:600;font-size:13px;color:var(--text);padding:11px 14px}
.pyl-table tr.total-row td:first-child{text-align:left}
.pyl-table tr.ebitda-row td{background:rgba(155,32,32,.08);border-top:2px solid var(--blue-dim);border-bottom:2px solid var(--blue-dim);font-weight:600;color:var(--text);padding:9px 14px}
.pyl-table tr.ebitda-row td:first-child{text-align:left;color:var(--blue)}
.pyl-table .val-pos{color:var(--green)!important}
.pyl-table .val-neg{color:var(--red)!important}
.pyl-table .val-neu{color:var(--text2)!important}
.pyl-table tr:hover td{background:rgba(255,255,255,.012)}
.pyl-table tr.section-header:hover td,.pyl-table tr.total-row:hover td,.pyl-table tr.ebitda-row:hover td{background:unset}
.pyl-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.pyl-period-header{display:grid;gap:0;background:var(--bg2)}
</style>
</head>
<body>

<div class="cfg-strip" id="cfg">
  <span>⚡ Google Sheet URL:</span>
  <input type="url" id="cfg-url" placeholder="https://script.google.com/macros/s/…/exec" oninput="saveUrl()">
  <button class="btn btn-prim btn-sm" id="btn-test" onclick="testConn()">Probar conexión</button>
  <span id="cfg-status"></span>
  <button class="btn btn-sec btn-sm" onclick="document.getElementById('cfg').style.display='none'" style="margin-left:auto">Ocultar</button>
</div>

<div class="topbar">
  <span class="logo" style="display:flex;align-items:center;gap:8px">
  <svg width="28" height="20" viewBox="0 0 56 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 0 L18 0 Q28 0 28 20 Q28 40 18 40 L0 40 Z M6 8 L6 32 L16 32 Q22 32 22 20 Q22 8 16 8 Z" fill="#9B2020"/>
    <path d="M30 0 L38 0 L48 30 L58 0 L66 0 L52 40 L44 40 Z" fill="#888"/>
  </svg>
  <span>DOMINIO VISUAL</span>
</span>
  <button class="nav-btn active" onclick="go('dash',this)">Dashboard</button>
  <button class="nav-btn" onclick="go('disponibilidad',this)">Disponibilidad</button>
  <button class="nav-btn" onclick="go('ventas',this)">Campañas</button>
  <button class="nav-btn" onclick="go('nueva-venta',this)">+ Venta</button>
  <button class="nav-btn" onclick="go('cobranzas',this)">Cobranzas</button>
  <button class="nav-btn" onclick="go('costos',this)">Costos</button>
  <button class="nav-btn" onclick="go('inversiones',this)">Inversiones</button>
  <button class="nav-btn" onclick="go('iva',this)">IVA</button>
  <button class="nav-btn" onclick="go('pyl',this)">P&L</button>
  <button class="nav-btn" onclick="go('cashflow',this)">Cashflow</button>
  <button class="nav-btn" onclick="document.getElementById('cfg').style.display='flex'" style="margin-left:auto;color:var(--text3)">⚙</button>
</div>

<div class="page on" id="page-dash">
  <div class="stats s4" id="ds-kpis"></div>
  <div class="fbar">
    <div class="fg"><label>Desde</label><input type="date" id="dd-desde" oninput="renderDash()"></div>
    <div class="fg"><label>Hasta</label><input type="date" id="dd-hasta" oninput="renderDash()"></div>
    <div class="fg"><label>Estado</label>
      <select id="dd-est" onchange="renderDash()">
        <option value="">Todos</option><option value="libre">Libres</option>
        <option value="medio">Parciales</option><option value="lleno">Sin disp.</option>
      </select>
    </div>
    <button class="btn btn-sec btn-sm" onclick="['dd-desde','dd-hasta'].forEach(i=>_(i).value='');_('dd-est').value='';renderDash()">Limpiar</button>
    <button class="btn btn-prim btn-sm" onclick="syncAll()" style="margin-left:auto">↻ Sincronizar todo</button>
  </div>
  <div class="sop-grid" id="ds-grid"></div>
</div>

<div class="page" id="page-disponibilidad">
  <div class="form-box">
    <div class="form-title">Consultar disponibilidad antes de vender</div>
    <div class="fg2">
      <div class="field"><label>Fecha inicio</label><input type="date"
